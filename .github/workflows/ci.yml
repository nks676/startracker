name: CI

on: [push, pull_request]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y build-essential cmake git

      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --parallel

      - name: Unit Tests
        run: cd build && ctest --output-on-failure

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python dependencies
        run: pip install -r tools/requirements.txt

      - name: Full Pipeline Test
        run: bash tests/test_full_pipeline.sh

      - name: Real-image Regression
        run: bash tests/test_real_images.sh

      - name: Monte Carlo Validation
        run: bash tests/test_monte_carlo.sh
